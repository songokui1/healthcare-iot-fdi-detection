[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "medguard-ai-research"
version = "0.1.0"
description = "Private experimental LLM/RAG/hybrid healthcare IoT intrusion analysis"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<3",
  "pandas>=2,<3",
  "scikit-learn>=1.3,<2",
]

[project.optional-dependencies]
llm = ["openai>=1.40,<3"]
dev = ["pytest>=8,<10"]
baseline = ["lightgbm>=4,<5"]
dashboard = ["streamlit>=1.35,<2"]

[project.scripts]
medguard = "medguard.cli:main"

[tool.setuptools.packages.find]
include = ["medguard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
