name: Private research CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -e '.[dev,baseline]'
      - name: Compile Python source and dashboard
        run: python -m compileall -q medguard dashboard.py
      - name: Run offline tests
        run: python -m pytest -q
      - name: Synthetic smoke test (no real LLM or dataset)
        run: python -m medguard.cli --max-test-rows 12 --output outputs/ci-smoke.json
